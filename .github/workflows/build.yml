name: Build CS16Client (PC & Android Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (Release APK)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17 (for Android SDK Manager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fill Android SDK Dependencies & NDK
        run: |
          echo "Accepting Android SDK licenses..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          echo "Installing required Android SDK packages & NDK..."
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
              "platform-tools" \
              "platforms;android-29" \
              "build-tools;28.0.3" \
              "cmake;3.10.2.4988404" \
              "ndk;21.4.7075529" && break || {
                if [ $attempt -eq 3 ]; then exit 1; fi
                echo "Attempt $attempt failed, retrying in 5s..."
                sleep 5
              }
          done

          echo "Setting NDK environment variables..."
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/21.4.7075529" >> $GITHUB_ENV

          echo "Creating local.properties..."
          cat <<EOF > Android/local.properties
          sdk.dir=${ANDROID_HOME}
          ndk.dir=${ANDROID_HOME}/ndk/21.4.7075529
          EOF

      - name: Set up JDK 8 (for Gradle 5.4.1 & AGP 3.5.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Make Gradle Wrapper Executable
        run: chmod +x Android/gradlew

      - name: Build Android Release APK with Gradle
        run: |
          cd Android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-Android-Release-APK
          path: Android/app/build/outputs/apk/release/*.apk

  build-windows:
    name: Build PC (Windows Release x86)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -A Win32 `
            -DXASH_STATIC=OFF `
            -DXASH_DLL_LOADER=OFF `
            -DXASH_SDL=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build with MSVC (Release)
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist-windows" -Force
          if (Test-Path "SDL2\lib\x86\SDL2.dll") {
            Copy-Item "SDL2\lib\x86\SDL2.dll" "dist-windows\" -Force
          }
          Get-ChildItem -Path "build" -Recurse -Include "*.dll","*.exe" | ForEach-Object {
            if ($_.FullName -notmatch "CMakeFiles") {
              Copy-Item $_.FullName "dist-windows\" -Force
            }
          }
          Get-ChildItem -Path "dist-windows"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS16Client-PC-Windows-Release-x86
          path: dist-windows/
